<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor</title>
<style>
/* Übersichtstafel für Flur oder Wartebereich: welcher Patient wurde zuletzt
   in welchen Raum gerufen. Helles, ruhiges Bild – die Farbe kommt allein vom
   jeweiligen Raum. */
:root {
  --bg: #f4f7fa;
  --surface: #ffffff;
  --line: #e2e9f0;
  --text: #243447;
  --muted: #6b7f94;
  --accent: #2f6f9f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#wrap { height: 100vh; display: grid; grid-template-rows: auto 1fr; }

header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 2.4vh 3.4vw; background: var(--surface); border-bottom: 1px solid var(--line);
}
.practice { font-size: 2.7vh; font-weight: 600; color: var(--muted); }
.clock { font-size: 3.4vh; font-weight: 300; font-variant-numeric: tabular-nums; }

#board {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(340px, 45vw), 1fr));
  gap: 1.7vh;
  padding: 2.6vh 3.4vw;
  align-content: start;
  overflow: hidden;
}
.tile {
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 0.6vh solid var(--room, var(--accent));
  border-radius: 1.1vh;
  padding: 2.4vh 2.6vh;
  min-height: 16vh;
  display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: 0 1px 3px rgba(36, 52, 71, 0.05);
}
.tile.fresh { animation: flash 1.6s ease-out 3; }
@keyframes flash {
  0%, 100% { background: var(--surface); }
  50% { background: color-mix(in srgb, var(--room, var(--accent)) 9%, #fff); }
}
.tile .room { font-size: 2.4vh; font-weight: 650; color: var(--room, var(--accent)); letter-spacing: 0.01em; }
.tile .who { font-size: 5vh; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; margin: 1vh 0; }
.tile .who.empty { color: #a9b7c6; font-weight: 300; font-size: 3.3vh; }
.tile .when { font-size: 2vh; color: var(--muted); font-variant-numeric: tabular-nums; }

#conn {
  position: fixed; top: 1.1vh; right: 0.9vw;
  width: 1vh; height: 1vh; border-radius: 50%;
  background: #3d8168; opacity: .35;
}
#conn[data-state="off"] { background: #b1524e; opacity: 1; }
</style>
</head>
<body>
<div id="conn"></div>
<div id="wrap">
  <header>
    <div class="practice" id="practiceName">Praxis</div>
    <div class="clock" id="clock">--:--</div>
  </header>
  <div id="board"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/monitor.js"></script>
</body>
</html>
